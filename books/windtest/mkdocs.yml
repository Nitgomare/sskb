site_name: "Blaabjerg 等 - 2024 - 风力发电系统中的电力电子技术_中文翻译"

docs_dir: docs
site_dir: "../../site/books/windtest"

theme:
  name: material
  language: zh

  icon:
    logo: material/wind-turbine

  features:
    - toc.follow
    - navigation.top
    - navigation.footer
    - navigation.path
    - content.code.copy

nav:
  - 图书首页: index.md
  - "第1章 引言": chapters/01-chapter/index.md
  - "第2章 风力发电系统的技术现状": chapters/02-chapter/index.md
  - "第3章 风力发电系统中的电力电子技术": chapters/03-chapter/index.md
  - "第4章 风力发电系统的运行与控制": chapters/04-chapter/index.md
  - "第5章 风力发电系统在电力系统中的应用": chapters/05-chapter/index.md
  - "第6章 欧盟风力发电系统代表性项目": chapters/06-chapter/index.md
  - "第7章 展望": chapters/07-chapter/index.md
  - 参考文献与附加信息: 99-back-matter/index.md

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
      toc_depth: "2-3"

extra_javascript:
  - assets/javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  homepage: "/"
