# ============================================================
# 网站基本信息
# ============================================================

site_name: "科研技能"
site_description: "面向研究生的科研工具与实践教程"
site_author: "课题组"

# 生成网页时使用的文档目录
docs_dir: docs

# 生成后的静态网站目录
site_dir: site

# 是否使用简洁网址
# 例如：01-literature/01-search-tools/
# 而不是：01-literature/01-search-tools.html
use_directory_urls: true


# ============================================================
# Material主题配置
# ============================================================

theme:
  name: material

  # 中文界面
  language: zh

  # 网站左上角图标
  icon:
    logo: material/school

  # 浅色和深色模式
  palette:

    # 浅色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: green

      toggle:
        icon: material/brightness-7
        name: 切换到深色模式

    # 深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: green

      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

  # 页面功能
  features:

    # 左侧目录按章节分组显示
    - navigation.sections

    # 默认展开左侧目录
    - navigation.expand

    # 页面顶部显示当前位置路径
    - navigation.path

    # 页面滚动时显示返回顶部按钮
    - navigation.top

    # 页面底部显示上一页和下一页
    - navigation.footer

    # 页面切换时不完全刷新网页
    - navigation.instant

    # 右侧页内目录跟随滚动
    - toc.follow

    # 代码块显示复制按钮
    - content.code.copy

    # 代码注释功能
    - content.code.annotate

    # 标签页内容可以相互关联
    - content.tabs.link


# ============================================================
# 插件配置
# ============================================================

plugins:

  # 全文搜索
  - search:
      lang:
        - zh
        - en

      # 搜索结果分词符号
      separator: '[\s\-\.]+'


# ============================================================
# Markdown扩展
# ============================================================

markdown_extensions:

  # 提示框
  - admonition

  # 表格
  - tables

  # 为Markdown元素添加CSS属性
  - attr_list

  # 在HTML标签内部继续解析Markdown
  - md_in_html

  # 脚注
  - footnotes

  # 定义列表
  - def_list

  # 标题自动编号和锚点
  - toc:
      permalink: true
      permalink_title: "复制本节链接"
      toc_depth: 2-4

  # 可折叠提示框
  - pymdownx.details

  # 增强代码块
  - pymdownx.superfences

  # 代码语法高亮
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true

  # 行内代码高亮
  - pymdownx.inlinehilite

  # 键盘按键显示
  - pymdownx.keys

  # 删除线
  - pymdownx.tilde

  # 上标
  - pymdownx.caret

  # 下标
  - pymdownx.mark

  # 标签页
  - pymdownx.tabbed:
      alternate_style: true

  # Material图标和Emoji
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - assets/javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js


